<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OGCA Tesla Engine Sounds</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="shortcut icon" href="logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">

    <!-- ── HEADER ───────────────────────────────────────────────────────── -->
    <header class="top-bar">
      <div class="brand">
        <img src="logo.png" alt="OGCA Logo" class="brand-logo" width="30" height="30" style="width:30px; height:30px; max-width:30px; max-height:30px; flex-shrink:0;" />
        <h1>OGCA TESLA SOUNDS</h1>
      </div>
      <div class="status-badges">
        <div id="gps-status" class="badge badge-warning">
          <span class="dot"></span><span id="gps-status-text">GPS: Inactivo</span>
        </div>
        <div id="audio-status" class="badge badge-danger">
          <span class="dot"></span><span id="audio-status-text">Audio: Apagado</span>
        </div>
      </div>
    </header>

    <!-- ── CLUSTER (Gauges + Ignition) ──────────────────────────────────── -->
    <section class="cluster">

      <!-- Velocímetro -->
      <div class="gauge-card">
        <div class="gauge-display">
          <svg class="gauge-svg" viewBox="0 0 200 200">
            <path class="gauge-bg" d="M 30 160 A 80 80 0 1 1 170 160" />
            <path id="speed-gauge-fill" class="gauge-fill speed-fill"
                  d="M 30 160 A 80 80 0 1 1 170 160"
                  stroke-dasharray="380" stroke-dashoffset="380" />
          </svg>
          <div class="gauge-center">
            <span id="speed-value" class="value-huge">0</span>
            <span id="unit-label" class="unit-text">KM/H</span>
          </div>
        </div>
        <div class="gauge-footer">VELOCIDAD</div>
      </div>

      <!-- Botón de encendido central -->
      <div class="ignition-center">
        <button id="btn-ignition" class="ignition-btn">
          <div class="btn-inner">
            <span class="power-icon">⏻</span>
            <span class="btn-text" id="ignition-text">START</span>
          </div>
        </button>
        <div class="gear-badge" id="gear-indicator">STOP</div>
      </div>

      <!-- Tacómetro / BPM -->
      <div class="gauge-card">
        <div class="gauge-display">
          <svg class="gauge-svg" viewBox="0 0 200 200">
            <path class="gauge-bg" d="M 30 160 A 80 80 0 1 1 170 160" />
            <path id="rpm-gauge-fill" class="gauge-fill rpm-fill"
                  d="M 30 160 A 80 80 0 1 1 170 160"
                  stroke-dasharray="380" stroke-dashoffset="380" />
          </svg>
          <div class="gauge-center">
            <span id="rpm-value" class="value-huge">800</span>
            <span id="rpm-label" class="unit-text">RPM</span>
          </div>
        </div>
        <div class="gauge-footer">REVOLUCIONES</div>
      </div>

    </section>

    <!-- ── PRESETS ───────────────────────────────────────────────────────── -->
    <section class="preset-section">

      <!-- Motores -->
      <div class="preset-group">
        <span class="group-label">⚙️ MOTORES</span>
        <div class="preset-chips">
          <button class="chip active" data-preset="v8_muscle">🏎️ V8 Muscle</button>
          <button class="chip" data-preset="v10_exotic">🦅 V10 Super</button>
          <button class="chip" data-preset="rotary_turbo">🔄 Rotary</button>
          <button class="chip" data-preset="cyber_hyper">⚡ Cyber EV</button>
          <button class="chip" data-preset="harley">🏍️ Harley</button>
          <button class="chip" data-preset="moto_sport">🏁 Moto Sport</button>
          <button class="chip" data-preset="f1">🏆 F1</button>
          <button class="chip" data-preset="tractor">🚜 Tractor</button>
          <button class="chip" data-preset="lancha">⛵ Lancha</button>
        </div>
      </div>

      <!-- Vehículos especiales -->
      <div class="preset-group">
        <span class="group-label">🐴 ESPECIALES</span>
        <div class="preset-chips">
          <button class="chip" data-preset="horse">🐴 Caballo</button>
          <button class="chip" data-preset="carreta">🪵 Carreta</button>
          <button class="chip" data-preset="sleigh">🎅 Trineo</button>
        </div>
      </div>

    </section>

    <!-- ── SETTINGS BAR ──────────────────────────────────────────────────── -->
    <section class="settings-bar">

      <!-- Modo GPS / Demo -->
      <div class="sbar-group">
        <span class="sbar-label">MODO</span>
        <div class="toggle-group">
          <button id="mode-gps" class="toggle-btn active">GPS</button>
          <button id="mode-demo" class="toggle-btn">Manual</button>
        </div>
      </div>

      <!-- Transmisión -->
      <div class="sbar-group" id="transmission-group">
        <span class="sbar-label">TRANS</span>
        <select id="transmission-select" class="custom-select">
          <option value="auto_6">6M</option>
          <option value="auto_7">7M DCT</option>
          <option value="direct">EV</option>
        </select>
      </div>

      <!-- Volumen -->
      <div class="sbar-group vol-group">
        <span class="sbar-label">🔊 VOL</span>
        <input type="range" id="master-volume" min="0" max="100" value="80" class="custom-range" />
      </div>

      <!-- Checkboxes compactos -->
      <div class="sbar-checks">
        <label class="mini-check">
          <input type="checkbox" id="pop-fx-toggle" checked />
          <span class="checkmark"></span>Pops
        </label>
        <label class="mini-check">
          <input type="checkbox" id="unit-toggle" />
          <span class="checkmark"></span>MPH
        </label>
      </div>

      <!-- Throttle demo (oculto por defecto) -->
      <div id="demo-controls" class="sbar-group demo-inline hidden">
        <span class="sbar-label">ACEL <span id="demo-throttle-val">0%</span></span>
        <input type="range" id="throttle-slider" min="0" max="100" value="0" class="custom-range" />
      </div>

    </section>

    <!-- ── TELEMETRÍA (barra compacta) ───────────────────────────────────── -->
    <section class="telemetry-bar">
      <div class="tbar-item">
        <span class="tbar-label">GPS</span>
        <span id="t-gps-speed" class="tbar-val">0.0 km/h</span>
      </div>
      <div class="tbar-item">
        <span class="tbar-label">Acel</span>
        <span id="t-accel" class="tbar-val">0.00 m/s²</span>
      </div>
      <div class="tbar-item">
        <span class="tbar-label">Freq</span>
        <span id="t-freq" class="tbar-val">0 Hz</span>
      </div>
      <div class="tbar-item tbar-coords">
        <span id="t-coords" class="tbar-val">Esperando GPS...</span>
      </div>
      <div class="tbar-item">
        <span id="telemetry-accuracy" class="tbar-val">Prec: --m</span>
      </div>
    </section>

    <!-- Input oculto para idle volume (mantenido por compatibilidad JS) -->
    <input type="range" id="idle-volume" min="10" max="100" value="50" style="display:none;" />

  </div>

  <script src="audio-engine.js"></script>
  <script src="rhythmic-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
