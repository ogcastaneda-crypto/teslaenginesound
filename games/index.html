<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OGCAgames</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            align-items: center;
            justify-content: center;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        p.subtitle {
            color: #94a3b8;
            margin-top: 0.5rem;
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.5rem;
            width: 90%;
            max-width: 800px;
            padding: 1rem;
        }

        .game-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #334155;
        }

        .game-card:hover {
            transform: translateY(-5px);
            background-color: #273548;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: var(--accent-color);
        }

        .game-card h3 {
            margin: 0 0 0.5rem 0;
            font-size: 1.25rem;
            color: var(--accent-color);
        }

        .game-card p {
            margin: 0;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        footer {
            margin-top: 3rem;
            color: #64748b;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <h1>OGCAgames</h1>
        <p class="subtitle">Selecciona un juego para comenzar</p>
    </header>

    <div class="container">
        <a href="bichos.html" class="game-card">
            <h3>Bichos</h3>
            <p>Juega atrapando o interactuando con bichos.</p>
        </a>

        <a href="globos.html" class="game-card">
            <h3>Globos</h3>
            <p>Diviértete reventando globos en pantalla.</p>
        </a>

        <a href="lab.html" class="game-card">
            <h3>Laberinto</h3>
            <p>Encuentra la salida resolviendo el laberinto.</p>
        </a>
    </div>

    <footer>
        &copy; 2026 OGCAgames. Todos los derechos reservados.
    </footer>

</body>
</html>
