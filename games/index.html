<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#24102f; --plum-2:#34193f; --plum-3:#4b2859;
    --ink:#fff4e6; --muted:#c9b4d3; --pink:#ff6fa5; --sun:#ffd23f;
    --font:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  [hidden]{display:none !important}
  html,body{margin:0;background:var(--plum);color:var(--ink);font-family:var(--font)}
  body.playing{overflow:hidden}

  .wrap{max-width:1020px;margin:0 auto;padding:clamp(24px,6vw,64px) 18px 48px}
  header{margin-bottom:clamp(22px,4vw,40px)}
  h1{margin:0;font-size:clamp(44px,10vw,92px);line-height:.95;font-weight:700;letter-spacing:-.01em}
  header p{margin:14px 0 0;max-width:44ch;font-size:clamp(16px,2.4vw,20px);line-height:1.4;color:var(--muted)}

  .grid{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{display:flex;flex-direction:column;gap:14px;height:100%;padding:12px 12px 18px;border-radius:26px;
    background:var(--plum-2);color:inherit;text-decoration:none;
    box-shadow:0 0 0 2px var(--plum-3);transition:transform .15s ease, box-shadow .15s ease}
  .card:hover,.card:focus-visible{transform:translateY(-4px);box-shadow:0 0 0 3px var(--c,var(--pink)), 0 14px 28px rgba(0,0,0,.35)}
  .card:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
  .card:active{transform:translateY(0)}
  .tile{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;border-radius:18px;
    background:var(--c,var(--pink));overflow:hidden}
  .tile::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.28), transparent 55%)}
  .ico{position:relative;z-index:1;font-size:clamp(64px,12vw,88px);line-height:1;transition:transform .2s ease;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.18));font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
  .tile img{position:relative;z-index:1;width:46%;height:70%;object-fit:contain;transition:transform .2s ease;filter:drop-shadow(0 6px 0 rgba(0,0,0,.18))}
  .card:hover .ico,.card:focus-visible .ico,.card:hover .tile img,.card:focus-visible .tile img{transform:rotate(-8deg) scale(1.12)}
  .info{padding:0 8px}
  .info h2{margin:0 0 4px;font-size:24px;line-height:1.15;font-weight:600}
  .info p{margin:0;font-size:15px;line-height:1.4;color:var(--muted)}

  .skeleton{height:250px;border-radius:26px;background:linear-gradient(100deg,var(--plum-2) 30%,var(--plum-3) 50%,var(--plum-2) 70%);
    background-size:300% 100%;animation:shimmer 1.4s linear infinite}
  @keyframes shimmer{from{background-position:100% 0}to{background-position:0 0}}

  .status{margin:22px 0 0;max-width:60ch;font-size:17px;line-height:1.5;color:var(--muted)}
  .status b{color:var(--ink)}
  .status code{background:var(--plum-2);padding:2px 7px;border-radius:7px;font-size:.92em;color:var(--sun)}

  /* Reproductor */
  .player{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;background:var(--plum);height:100vh;height:100dvh}
  .bar{display:flex;align-items:center;gap:12px;padding:6px 12px;padding-top:calc(6px + env(safe-area-inset-top, 0px));
    background:var(--plum-2);box-shadow:0 2px 0 var(--plum-3)}
  .back{font:inherit;font-weight:600;font-size:16px;color:#33100f;background:var(--sun);border:0;border-radius:99px;
    padding:8px 18px;cursor:pointer}
  .back:focus-visible,.open:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
  .ptitle{flex:1;min-width:0;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .open{font-size:14px;color:var(--muted);text-decoration:underline;white-space:nowrap}
  iframe{flex:1;width:100%;border:0;background:#000}

  @media (prefers-reduced-motion: reduce){
    .card,.ico,.tile img{transition:none}
    .skeleton{animation:none}
  }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <h1 id="site-title">Juegos</h1>
    <p>Elige uno y juega. Algunos usan la cámara web y otros el giroscopio del celular.</p>
  </header>
  <ul class="grid" id="grid"></ul>
  <p class="status" id="status" hidden></p>
</main>

<div class="player" id="player" hidden>
  <div class="bar">
    <button class="back" id="back" type="button">Volver al menú</button>
    <span class="ptitle" id="ptitle"></span>
    <a class="open" id="popen" target="_blank" rel="noopener">Abrir aparte</a>
  </div>
  <iframe id="frame" title="Juego" allow="camera; microphone; gyroscope; accelerometer; magnetometer; fullscreen; autoplay" allowfullscreen></iframe>
</div>

<script>
/* ============ Configuración ============ */
const CONFIG = {
  folder: "./",            // misma carpeta donde está este archivo
  manifest: "games.json",  // plan B si el servidor no deja listar la carpeta
  siteTitle: "Juegos"
};
const PALETTE = ["#ff6fa5", "#ffd23f", "#5fe3b5", "#6bb8ff", "#ff9a3c", "#b38bff"];

/* ============ Utilidades ============ */
const $ = (s) => document.querySelector(s);
const grid = $("#grid"), statusEl = $("#status");
const base = new URL(CONFIG.folder, location.href);
const encPath = (p) => p.split("/").map(encodeURIComponent).join("/");
let games = [];
const selfName = decodeURIComponent(location.pathname.split("/").pop() || "");  // nombre de esta misma página

document.title = CONFIG.siteTitle;
$("#site-title").textContent = CONFIG.siteTitle;

const prettify = (file) => {
  const n = file.replace(/\.html?$/i, "").replace(/[-_]+/g, " ").trim();
  return n.charAt(0).toUpperCase() + n.slice(1);
};
const looksLikeImage = (v) => /^(https?:|data:|\/|\.{1,2}\/)|\.(png|svg|jpe?g|webp|gif|ico)(\?|$)/i.test(v);

/* ============ 0. API del servidor (server.py) ============ */
async function listFromApi() {
  const r = await fetch(new URL("api/games", location.href).href, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const data = await r.json();
  if (!Array.isArray(data) || !data.length) throw new Error("sin juegos");
  return data.map((f) => ({ file: f }));
}

/* ============ 0b. GitHub Pages: lee la carpeta del repo con la API de GitHub ============ */
async function listFromGitHub() {
  if (!/\.github\.io$/i.test(location.hostname)) throw new Error("no es github.io");
  const owner = location.hostname.split(".")[0];
  const parts = location.pathname.split("/").filter(Boolean).map(decodeURIComponent);
  if (parts.length && /\.[a-z0-9]+$/i.test(parts[parts.length - 1])) parts.pop();   // quita index.html si viene en la URL
  const repo = parts.shift();
  if (!repo) throw new Error("sin repo");
  const dir = parts.map(encodeURIComponent).join("/");
  const url = "https://api.github.com/repos/" + owner + "/" + repo + "/contents" + (dir ? "/" + dir : "");
  const r = await fetch(url, { headers: { Accept: "application/vnd.github+json" } });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const items = await r.json();
  const out = items
    .filter((f) => f.type === "file" && /\.html?$/i.test(f.name) && !/^(index\.html?$|_)/i.test(f.name) && f.name !== selfName)
    .map((f) => ({ file: f.name }));
  if (!out.length) throw new Error("sin html");
  return out;
}

/* ============ 1. Barrer la carpeta ============ */
async function listFromDirectory() {
  const r = await fetch(base.href, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const doc = new DOMParser().parseFromString(await r.text(), "text/html");
  const seen = new Set(), out = [];
  doc.querySelectorAll("a[href]").forEach((a) => {
    const href = a.getAttribute("href");
    if (!href || /^[?#]/.test(href)) return;
    let u; try { u = new URL(href, base); } catch (e) { return; }
    if (u.origin !== base.origin || !u.pathname.startsWith(base.pathname)) return;
    const rel = decodeURIComponent(u.pathname.slice(base.pathname.length));
    if (!rel || rel.includes("/")) return;               // solo archivos directos de la carpeta
    if (!/\.html?$/i.test(rel)) return;                  // solo .html
    if (/^(index\.html?$|_)/i.test(rel)) return;         // ignora index.html y archivos que empiezan con _
    if (selfName && rel === selfName) return;            // ignora esta misma página aunque tenga otro nombre
    if (seen.has(rel)) return;
    seen.add(rel); out.push({ file: rel });
  });
  if (!out.length) throw new Error("sin html");
  return out;
}

/* ============ 2. Plan B: games.json ============ */
async function listFromManifest() {
  const r = await fetch(new URL(CONFIG.manifest, location.href).href, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  let data = await r.json();
  if (data && !Array.isArray(data)) data = data.games;
  if (!Array.isArray(data) || !data.length) throw new Error("manifiesto vacío");
  return data.map((g) => (typeof g === "string" ? { file: g } : g))
             .filter((g) => g && g.file && g.file !== selfName && !/^index\.html?$/i.test(g.file));
}

/* ============ 3. Leer título, icono y descripción de cada juego ============ */
async function enrich(g) {
  g.url = new URL(encPath(g.file), base).href;
  const need = !(g.title && g.icon && g.description);
  if (need) {
    try {
      const r = await fetch(g.url);
      const doc = new DOMParser().parseFromString(await r.text(), "text/html");
      const meta = (n) => { const m = doc.querySelector('meta[name="' + n + '"]'); return m ? m.getAttribute("content").trim() : ""; };
      g.title = g.title || doc.title.trim();
      g.description = g.description || meta("game-description") || meta("description");
      g.color = g.color || meta("game-color");
      g.order = g.order ?? (parseFloat(meta("game-order")) || undefined);
      if (!g.icon) {
        g.icon = meta("game-icon");
        if (!g.icon) {
          const l = doc.querySelector('link[rel~="icon"]');
          if (l && l.getAttribute("href")) g.icon = new URL(l.getAttribute("href"), g.url).href;
        }
      }
    } catch (e) { /* si no se puede leer, usa valores por defecto */ }
  }
  g.title = g.title || prettify(g.file);
  g.icon = g.icon || "🎮";
  g.description = g.description || "";
  if (looksLikeImage(g.icon) && !/^(https?:|data:)/i.test(g.icon)) g.icon = new URL(g.icon, g.url).href;
  return g;
}

/* ============ Dibujar ============ */
function render() {
  grid.innerHTML = "";
  games.forEach((g, i) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.className = "card";
    a.href = "#juego=" + encodeURIComponent(g.file);
    a.style.setProperty("--c", g.color || PALETTE[i % PALETTE.length]);

    const tile = document.createElement("div");
    tile.className = "tile";
    if (looksLikeImage(g.icon)) {
      const img = document.createElement("img");
      img.src = g.icon; img.alt = "";
      tile.appendChild(img);
    } else {
      const s = document.createElement("span");
      s.className = "ico"; s.textContent = g.icon; s.setAttribute("aria-hidden", "true");
      tile.appendChild(s);
    }
    const info = document.createElement("div");
    info.className = "info";
    const h = document.createElement("h2"); h.textContent = g.title;
    info.appendChild(h);
    if (g.description) { const p = document.createElement("p"); p.textContent = g.description; info.appendChild(p); }

    a.append(tile, info);
    a.addEventListener("click", (e) => { e.preventDefault(); openGame(g, true); });
    li.appendChild(a);
    grid.appendChild(li);
  });
}

function showStatus(html) { statusEl.innerHTML = html; statusEl.hidden = false; }

/* ============ Reproductor ============ */
const player = $("#player"), frame = $("#frame");

function openGame(g, push) {
  $("#ptitle").textContent = g.icon && !looksLikeImage(g.icon) ? g.icon + "  " + g.title : g.title;
  $("#popen").href = g.url;
  frame.src = g.url;
  player.hidden = false;
  document.body.classList.add("playing");
  if (push) history.pushState({ file: g.file }, "", "#juego=" + encodeURIComponent(g.file));
  $("#back").focus();
}

function closeUI() {
  frame.src = "about:blank";       // al descargar el iframe se apaga la cámara
  player.hidden = true;
  document.body.classList.remove("playing");
}

function closeGame() {
  if (history.state && history.state.file) history.back();     // popstate cierra la interfaz
  else { closeUI(); history.replaceState(null, "", location.pathname + location.search); }
}

function gameFromHash() {
  const m = location.hash.match(/^#juego=(.+)$/);
  if (!m) return null;
  const file = decodeURIComponent(m[1]);
  return games.find((g) => g.file === file) || null;
}

$("#back").addEventListener("click", closeGame);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !player.hidden) closeGame(); });
window.addEventListener("popstate", () => {
  const g = gameFromHash();
  if (g) openGame(g, false); else closeUI();
});

/* ============ Arranque ============ */
(async function init() {
  for (let i = 0; i < 3; i++) { const li = document.createElement("li"); li.innerHTML = '<div class="skeleton"></div>'; grid.appendChild(li); }

  if (location.protocol === "file:") {
    grid.innerHTML = "";
    showStatus("Abre esta página desde un servidor (<b>http://</b> o <b>https://</b>). Si la abres con doble clic, el navegador no deja leer la carpeta.");
    return;
  }

  let list = null;
  try { list = await listFromApi(); } catch (e) { /* intenta GitHub */ }
  if (!list) { try { list = await listFromGitHub(); } catch (e) { /* intenta listado de directorio */ } }
  if (!list) { try { list = await listFromDirectory(); } catch (e) { /* intenta el plan B */ } }
  if (!list) { try { list = await listFromManifest(); } catch (e) { /* sin lista */ } }

  if (!list) {
    grid.innerHTML = "";
    showStatus("No pude encontrar los juegos. Revisa que haya archivos <code>.html</code> junto a esta página y que la página esté en GitHub Pages (repo público) o se sirva con <code>server.py</code>.");
    return;
  }

  games = await Promise.all(list.map(enrich));
  games.sort((a, b) => (a.order ?? 999) - (b.order ?? 999) || a.title.localeCompare(b.title, "es"));
  render();

  const g = gameFromHash();
  if (g) openGame(g, false);
})();
</script>
</body>
</html>
